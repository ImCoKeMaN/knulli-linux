image boot.vfat {
    vfat {
		extraargs = "-F 32 -n KNULLI -R 32"
		@files
	}
    size = 4G
}

image userdata.ext4 {
	ext4 {
		label = "SHARE"
		use-mke2fs = "true"
		extraargs = "-m 0"
	}
	size = "512M"
	mountpoint = "/userdata"
}

image knulli.img {
	hdimage {
		partition-table-type = "gpt"
		align = 1M
	}

	partition vfat {
		partition-type-uuid = U
		image = "boot.vfat"
		# offset = 32K
		offset = 1M
		bootable = true
	}

	partition userdata {
		partition-type-uuid = L
		image = "userdata.ext4"
	}
}
